name: Build OSS String Databases

on:
  # Rebuild the databases every Sunday at 00:00 UTC.
  schedule:
    - cron: '0 0 * * 0'

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

  # Rebuild when the orchestration script or this workflow changes on quantumstrand.
  push:
    branches:
      - quantumstrand
    paths:
      - 'floss/qs/db/data/oss/build_oss_db.py'
      - '.github/workflows/build-oss-db.yml'

  # Run on PRs that touch the automation so it can be verified before merging.
  pull_request:
    branches:
      - quantumstrand
    paths:
      - 'floss/qs/db/data/oss/build_oss_db.py'
      - '.github/workflows/build-oss-db.yml'

# Cancel any in-progress run when a newer one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-databases:
    name: Build OSS string databases
    runs-on: windows-latest

    env:
      # Workaround for zydis 3.1.3's CMakeLists.txt requiring an older
      # cmake_minimum_required syntax. Remove once Lancelot updates zydis.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'

    steps:
      - name: Checkout flare-floss
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: flare-floss

      - name: Checkout lancelot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: williballenthin/lancelot
          path: lancelot

      - name: Apply jh JSONL patch
        run: git apply ../flare-floss/.github/patches/jh-jsonl.patch
        working-directory: lancelot

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            lancelot/target/
          key: ${{ runner.os }}-cargo-jh-${{ hashFiles('lancelot/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-jh-

      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: ${{ runner.os }}-vcpkg-oss-db-${{ hashFiles('flare-floss/floss/qs/db/data/oss/build_oss_db.py') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-oss-db-

      - name: Build jh
        run: |
          cargo build --release -p lancelot-bin
        working-directory: lancelot

      - name: Build OSS databases
        run: |
          python floss/qs/db/data/oss/build_oss_db.py `
            --config floss\qs\db\data\oss\libraries.json `
            --jh-path ..\lancelot\target\release\jh.exe `
            --output-dir floss\qs\db\data\oss `
            --continue-on-error
        working-directory: flare-floss

      - name: Show metrics summary
        if: success() || failure()
        run: |
          Get-Content floss\qs\db\data\oss\build_metrics.json
        working-directory: flare-floss

      - name: Zip databases for download
        if: success() || failure()
        run: |
          $files = Get-ChildItem -Path floss\qs\db\data\oss -Filter *.jsonl.gz
          if ($files) {
            Compress-Archive -Path $files.FullName -DestinationPath floss\qs\db\data\oss\oss-string-databases.zip -Force
          } else {
            New-Item -ItemType File -Path floss\qs\db\data\oss\oss-string-databases.zip -Force | Out-Null
          }
        working-directory: flare-floss

      - name: Upload database artifact
        if: success() || failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb480 # v4.3.3
        with:
          name: oss-string-databases
          path: flare-floss/floss/qs/db/data/oss/oss-string-databases.zip
          if-no-files-found: ignore

      - name: Create Pull Request if databases changed
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          path: flare-floss
          base: quantumstrand
          commit-message: 'chore(oss-db): update string databases'
          title: 'Update OSS string databases'
          body: |
            Automated weekly rebuild of the OSS string databases.

            - Triplet: `x64-windows-static`
            - Compiler: `msvc143`
            - Libraries: openssl, sqlite3, curl, mbedtls, jemalloc

            See `floss/qs/db/data/oss/build_metrics.json` for per-library entry counts.
          branch: update-oss-string-databases
          delete-branch: true
